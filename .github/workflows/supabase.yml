name: Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: xmhyjttyarskimsxcfhl
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2

      - name: Restore paused Supabase project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}"
          status="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "${API}" | jq -r '.status // empty')"
          echo "Project status: ${status:-unknown}"
          if [ "${status}" = "INACTIVE" ] || [ "${status}" = "PAUSED" ]; then
            echo "Restoring paused project..."
            curl -sS -X POST -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "${API}/restore"
            for attempt in $(seq 1 30); do
              sleep 10
              status="$(curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "${API}" | jq -r '.status // empty')"
              echo "Restore attempt ${attempt}: ${status:-unknown}"
              if [ "${status}" = "ACTIVE_HEALTHY" ] || [ "${status}" = "ACTIVE_UNHEALTHY" ]; then
                echo "Project is active."
                break
              fi
            done
          fi

      - name: Sync Supabase database password
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            PASSWORD="${SUPABASE_DB_PASSWORD}"
            echo "Using SUPABASE_DB_PASSWORD from GitHub secrets."
          else
            PASSWORD="$(printf '%s' "${SUPABASE_ACCESS_TOKEN}" | openssl dgst -sha256 -hex | awk '{print substr($2,1,32)}')"
            echo "No SUPABASE_DB_PASSWORD secret — syncing derived password to Supabase..."
            http_code="$(curl -sS -o /tmp/supabase-password-response.json -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/password" \
              -d "{\"password\":\"${PASSWORD}\"}")"
            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              cat /tmp/supabase-password-response.json
              echo "::error::Failed to set database password (HTTP ${http_code})."
              exit 1
            fi
            echo "Database password synced to Supabase."
          fi
          echo "::add-mask::${PASSWORD}"
          echo "SUPABASE_DB_PASSWORD=${PASSWORD}" >> "${GITHUB_ENV}"

      - name: Link Supabase project
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair legacy migration history
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          # Older remote migration entries are not present in this repository.
          # Supabase CLI blocks `db push` until they are marked reverted.
          supabase migration repair --status reverted \
            20260228102612 \
            20260228103412 \
            20260228125027 \
            20260228132528 \
            20260408143447 || true

      - name: Push database migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase db push --include-all

      - name: Deploy admin Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase functions deploy admin-stats --no-verify-jwt
          supabase functions deploy admin-posts --no-verify-jwt
          supabase functions deploy admin-bookings --no-verify-jwt
          supabase functions deploy admin-subscribers --no-verify-jwt
          supabase functions deploy admin-counsellor-applications --no-verify-jwt
          supabase functions deploy admin-sync-github-posts --no-verify-jwt
          supabase functions deploy admin-blog-image-upload --no-verify-jwt

      - name: Seed blog posts from repo markdown
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/seed-blog-posts.js

      - name: Deploy summary
        if: always()
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Add SUPABASE_ACCESS_TOKEN to GitHub repo secrets for automatic function deploy."
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Add SUPABASE_SERVICE_ROLE_KEY to GitHub secrets to seed blog posts on push."
          fi
