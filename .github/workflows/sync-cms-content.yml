name: Sync CMS content

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export published content from Supabase
        run: SKIP_STATIC_GENERATE=1 node scripts/export-supabase-content.js

      - name: Regenerate static pages
        run: |
          node scripts/build-blog-css.js
          node scripts/generate-blog-manifest.js
          node scripts/generate-blog-index.js
          node scripts/generate-blog-routes.js
          node scripts/generate-resources.js

      - name: Commit synced content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/supabase-posts.json content/blog/manifest.json content/resources/guides.json blog resources
          if git diff --staged --quiet; then
            echo "No CMS content changes to commit."
            exit 0
          fi
          git commit -m "Sync published CMS content from Supabase"
          git push
